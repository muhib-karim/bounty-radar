name: sweep-and-publish

# Daily sweep of bounty/job/challenge sources, published to GitHub Pages.
# Also runs on demand via the "Run workflow" button.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the state-commit rebase never hits shallow-clone edge cases

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # gh CLI is preinstalled on ubuntu runners; auth via the built-in token.
      - name: Configure gh auth
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Sweep sources & build site
        run: node build-site.mjs feed.json site
        env:
          GH_TOKEN: ${{ github.token }}
          HN_ITEM_ID: ${{ vars.HN_ITEM_ID }} # set after Show HN submission → footer link appears automatically

      # Three-panel launch dashboard (HN points + stars + API traffic) as one
      # shareable SVG. Exits 0 with no output pre-launch — never blocks publish.
      - name: Build launch dashboard
        run: node build-dashboard.mjs site/dashboard.svg
        env:
          HN_ITEM_ID: ${{ vars.HN_ITEM_ID }}

      # Shareable charts: SVGs → PNG (2x density) for the HN first comment and
      # social posts. Best-effort — a sharp install hiccup never blocks publish,
      # but it is reported: the previous `>/dev/null 2>&1 || true` hid a pin to
      # a version that never existed. --omit=dev keeps the lint tooling out.
      - name: Render shareable PNGs
        run: |
          npm install --no-save --no-fund --no-audit --omit=dev sharp@0.34.5 \
            || echo "::warning::sharp install failed — PNG renders will be skipped"
          for f in momentum dashboard; do
            if [ -f "site/$f.svg" ]; then
              node render-chart.mjs "site/$f.svg" "site/$f.png" \
                || echo "::warning::$f.png render skipped (sharp install/render failed)"
            else
              echo "No $f.svg yet."
            fi
          done

      - name: Upload momentum.png artifact
        if: hashFiles('site/momentum.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: momentum
          path: site/momentum.png

      - name: Upload dashboard.png artifact
        if: hashFiles('site/dashboard.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: site/dashboard.png

      # Stable, login-free share URLs: force-push ONLY the rendered charts to
      # the gh-artifacts branch (orphan history — no bloat, always current).
      # raw.githubusercontent.com serves it without any GitHub login.
      # Best-effort: a push failure must never block publishing the site.
      - name: Publish charts to gh-artifacts branch
        if: hashFiles('site/momentum.*') != '' || hashFiles('site/dashboard.*') != ''
        run: |
          CHARTS="$(mktemp -d)"
          cp site/momentum.svg site/momentum.png site/dashboard.svg site/dashboard.png "$CHARTS/" 2>/dev/null || true
          if ! ls "$CHARTS"/* >/dev/null 2>&1; then
            echo "No rendered charts found — skipping branch publish."
            exit 0
          fi
          {
            echo "# Shareable launch charts"
            echo
            echo "Rendered by CI on every sweep — always current, no history kept."
            echo "Served login-free at:"
            echo
            echo "- https://raw.githubusercontent.com/muhib-karim/bounty-radar/gh-artifacts/dashboard.png"
            echo "- https://raw.githubusercontent.com/muhib-karim/bounty-radar/gh-artifacts/momentum.png"
            echo
            echo "(Same files are also on Pages: muhib-karim.github.io/bounty-radar/<file>)"
          } > "$CHARTS/README.md"
          git -C "$CHARTS" init -q -b gh-artifacts
          git -C "$CHARTS" add -A
          git -C "$CHARTS" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "charts: publish rendered launch charts (run ${{ github.run_id }})"
          if git -C "$CHARTS" push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-artifacts; then
            echo "Published to gh-artifacts: $(ls "$CHARTS" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::gh-artifacts push failed — charts still available as run artifacts and on Pages post-launch."
          fi

      - name: Fire alerts for new high-score listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ] || [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            # notify.mjs exits 1 when a channel fails, after recording the channels
            # that succeeded. That state must still be committed below (otherwise
            # the channel that worked is alerted again next sweep) and the site
            # must still publish, so a failure here is a warning, not a stop.
            node notify.mjs feed.json --state state/alerts-state.json \
              || echo "::warning::notify exited $? — at least one alert channel failed; its alerts stay queued for the next sweep."
          else
            echo "No webhook secrets configured — skipping alerts."
          fi

      # Race-safe: another workflow or a human may have pushed to main meanwhile.
      # Retry with rebase, but NEVER fail the job over it — publishing matters more
      # than tracking state (a lost dedup state just means an alert may repeat once).
      - name: Commit tracking state (alert dedup + first_seen map)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/alerts-state.json state/listings-seen.json
          if git diff --cached --quiet; then
            echo "No tracking-state changes to commit."
            exit 0
          fi
          git commit -m "chore: update tracking state"
          ok=0
          for i in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              ok=1; break
            fi
            echo "state-push attempt $i failed — rebasing on latest main and retrying…"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::Could not push tracking state after 3 attempts. Sweep + publish continue; dedup state may repeat one alert."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Guaranteed monitor poll + launch digest after every publish — cron ticks
      # are best-effort on GitHub, but these dispatches always fire on feed changes.
      - name: Trigger follow-up monitor poll + launch digest
        if: success()
        run: |
          gh api repos/${{ github.repository }}/dispatches -f event_type=hn-followup
          gh api repos/${{ github.repository }}/dispatches -f event_type=launch-digest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1