<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Bounty Radar: sweep, verify and rank open-source bounties, jobs and challenges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#10261f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- radar motif -->
  <g transform="translate(1060 160)">
    <circle r="150" fill="url(#glow)"/>
    <g fill="none" stroke="#3fb950" stroke-opacity="0.35" stroke-width="1.5">
      <circle r="130"/>
      <circle r="95"/>
      <circle r="60"/>
      <circle r="25"/>
      <line x1="-140" y1="0" x2="140" y2="0"/>
      <line x1="0" y1="-140" x2="0" y2="140"/>
    </g>
    <path d="M0 0 L130 0 A130 130 0 0 0 91.9 -91.9 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="130" y2="0" stroke="#56d364" stroke-width="2"/>
    <circle r="4" fill="#56d364"/>
    <!-- blips: verified (green), filtered out (grey) -->
    <circle cx="70" cy="-48" r="6" fill="#56d364"/>
    <circle cx="70" cy="-48" r="12" fill="none" stroke="#56d364" stroke-opacity="0.5"/>
    <circle cx="-58" cy="-72" r="5" fill="#56d364"/>
    <circle cx="-90" cy="40" r="5" fill="#6e7681"/>
    <circle cx="35" cy="88" r="5" fill="#d29922"/>
    <circle cx="105" cy="52" r="4" fill="#6e7681"/>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="68" font-weight="700" fill="#e6edf3">Bounty Radar</text>
    <text x="82" y="190" font-size="26" fill="#9fb3c8">Sweep, verify and rank open-source bounties, jobs and challenges</text>
    <g font-size="17" fill="#c9d1d9">
      <rect x="82" y="224" width="154" height="34" rx="17" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-opacity="0.6"/>
      <text x="159" y="247" text-anchor="middle">Node.js CLI</text>
      <rect x="250" y="224" width="154" height="34" rx="17" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="327" y="247" text-anchor="middle">MCP server</text>
      <rect x="418" y="224" width="180" height="34" rx="17" fill="#d29922" fill-opacity="0.15" stroke="#d29922" stroke-opacity="0.6"/>
      <text x="508" y="247" text-anchor="middle">Static site + RSS</text>
      <rect x="612" y="224" width="190" height="34" rx="17" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7" stroke-opacity="0.6"/>
      <text x="707" y="247" text-anchor="middle">Cloudflare Worker</text>
    </g>
  </g>
</svg>
