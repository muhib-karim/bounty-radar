<svg xmlns="http://www.w3.org/2000/svg" width="820" height="752" viewBox="0 0 820 752" role="img" aria-label="Terminal session: radar.mjs --help and npm test">
<rect width="820" height="752" rx="10" fill="#0d1117"/>
<rect width="820" height="32" rx="10" fill="#161b22"/><rect y="22" width="820" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="40" cy="16" r="6" fill="#ffbd2e"/><circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text x="410" y="21" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">bounty-radar</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
<text x="20" y="52" fill="#79c0ff">$ node radar.mjs --help</text>
<text x="20" y="72" fill="#e6edf3">Usage: node radar.mjs [options]</text>
<text x="20" y="92" fill="#e6edf3"></text>
<text x="20" y="112" fill="#e6edf3">Sweeps Algora, Opire and GitHub bounty labels, verifies each candidate repo</text>
<text x="20" y="132" fill="#e6edf3">is alive, and prints a ranked digest. Requires Node 20+ and an authenticated</text>
<text x="20" y="152" fill="#e6edf3">GitHub CLI (gh).</text>
<text x="20" y="172" fill="#e6edf3"></text>
<text x="20" y="192" fill="#e6edf3">Options:</text>
<text x="20" y="212" fill="#e6edf3">  --json          machine-readable JSON to stdout (progress on stderr)</text>
<text x="20" y="232" fill="#e6edf3">  --out FILE      also write the markdown digest to FILE</text>
<text x="20" y="252" fill="#e6edf3">  --max-age N     only keep listings at most N days old</text>
<text x="20" y="272" fill="#e6edf3">  -h, --help      show this help and exit</text>
<text x="20" y="292" fill="#e6edf3"></text>
<text x="20" y="312" fill="#79c0ff">$ npm test</text>
<text x="20" y="332" fill="#3fb950">✔ radar.mjs --help prints usage</text>
<text x="20" y="352" fill="#3fb950">✔ radar.mjs -h prints usage</text>
<text x="20" y="372" fill="#3fb950">✔ mcp-server.mjs --help prints usage</text>
<text x="20" y="392" fill="#3fb950">✔ notify.mjs --dry-run on the fixture feed sends nothing</text>
<text x="20" y="412" fill="#3fb950">✔ build-site.mjs renders HTML, RSS and JSON from a local feed</text>
<text x="20" y="432" fill="#3fb950">✔ initialize and tools/list advertise the four tools</text>
<text x="20" y="452" fill="#3fb950">✔ search_bounties filters, sorts and caps</text>
<text x="20" y="472" fill="#3fb950">✔ get_listing, whats_new and get_stats</text>
<text x="20" y="492" fill="#3fb950">✔ unknown tool and unknown method return JSON-RPC errors</text>
<text x="20" y="512" fill="#3fb950">✔ parseArgs</text>
<text x="20" y="532" fill="#3fb950">✔ spam and bait filters</text>
<text x="20" y="552" fill="#3fb950">✔ parseAlgoraText</text>
<text x="20" y="572" fill="#3fb950">✔ parseAlgoraJobs</text>
<text x="20" y="592" fill="#3fb950">✔ scoreBounty</text>
<text x="20" y="612" fill="#3fb950">✔ rankBounties / filterByMaxAge / listingKey</text>
<text x="20" y="632" fill="#3fb950">✔ renderMarkdown</text>
<text x="20" y="652" fill="#8b949e">ℹ tests 31</text>
<text x="20" y="672" fill="#8b949e">ℹ suites 7</text>
<text x="20" y="692" fill="#8b949e">ℹ pass 31</text>
<text x="20" y="712" fill="#8b949e">ℹ fail 0</text>
</g></svg>
